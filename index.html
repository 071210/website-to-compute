<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧠 Brain Tumor Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4c6ef5, #b197fc);
      color: white;
      text-align: center;
      padding: 30px;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    img {
      max-width: 250px;
      border-radius: 12px;
      margin-top: 15px;
    }
    input[type="file"] {
      margin: 20px 0;
    }
    button {
      background-color: #00b894;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #019875;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>🧠 Brain Tumor Classification</h1>
  <div class="card">
    <input type="file" id="fileInput" accept="image/*">
    <br>
    <button onclick="uploadImage()">Predict Tumor Type</button>
    <div id="result">
      <img id="uploadedImage" src="" alt="">
      <p id="resultText"></p>
      <p id="confidenceText"></p>
    </div>
  </div>

  <script>
    async function uploadImage() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return alert("Please choose an image!");

      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch("/predict", {
        method: "POST",
        body: formData
      });
      const result = await response.json();

      if (result.error) {
        alert(result.error);
        return;
      }

      document.getElementById("uploadedImage").src = result.file_path;
      document.getElementById("resultText").innerText =
        `Tumor Type: ${result.prediction}`;
      document.getElementById("confidenceText").innerText =
        `Confidence: ${result.confidence}%`;
    }
  </script>
</body>
</html>
